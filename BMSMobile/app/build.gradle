plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bluemark.bmsmobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.bluemark.bmsmobile"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // يُوقّع تلقائياً بمفتاح التصحيح إن لم تُضبط توقيعًا خاصًّا
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // توحيد (محاذاة) جميع وحدات Kotlin stdlib على نسخة واحدة لمنع تكرار الأصناف.
    // منذ Kotlin 1.8 أُدمجت kotlin-stdlib-jdk7/jdk8 داخل kotlin-stdlib، وهذه الـ BOM
    // ترفع نسخ jdk7/jdk8 القديمة (1.6.21 القادمة ترانزيتيًا من biometric) إلى نفس نسخة
    // kotlin-stdlib المتوافقة مع AndroidX وFirebase، فيزول خطأ checkDebugDuplicateClasses.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'

    // Firebase Firestore (أصلي) للاستماع للطلبات في الخلفية وإظهار الإشعارات.
    // تتم تهيئة FirebaseApp يدوياً داخل الخدمة (بدون google-services.json)
    // لأن نفس إعدادات Firebase موجودة أصلاً داخل تطبيق الويب.
    implementation platform('com.google.firebase:firebase-bom:33.3.0')
    implementation 'com.google.firebase:firebase-firestore'
}
