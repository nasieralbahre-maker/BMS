
name: Build BMS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Gradle wrapper
        working-directory: BMSMobile
        run: |
          ls -la
          test -f gradlew

      - name: Build debug APK
        working-directory: BMSMobile
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BMS-Android-APK
          path: BMSMobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
